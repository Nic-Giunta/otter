[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otter-dataframe"
version = "0.1.0"
description = "A modern dataframe library for Python, built for clarity, correctness, performance, and extensibility."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Otter Contributors" }]
keywords = ["dataframe", "analytics", "data-engineering", "lazy-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
]
pandas = ["pandas>=2.2"]
arrow = ["pyarrow>=16"]
numpy = ["numpy>=1.26"]
parquet = ["pyarrow>=16"]
sql = ["SQLAlchemy>=2.0"]
benchmark = ["pytest-benchmark>=4.0"]
all = ["pandas>=2.2", "pyarrow>=16", "numpy>=1.26", "SQLAlchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/otter-dataframe/otter"
Documentation = "https://github.com/otter-dataframe/otter/tree/main/docs"
Issues = "https://github.com/otter-dataframe/otter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otter = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "RUF"]
ignore = ["E501", "B009", "B010"]

[tool.mypy]
python_version = "3.11"
packages = ["otter"]
ignore_missing_imports = true
warn_unused_ignores = false
strict_optional = true
allow_redefinition = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["otter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
